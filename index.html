<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceBuddy - Money Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <button id="addBtn" class="btn btn-light">Add Transaction</button>
    
    <div class="container">
        <header>
            <h1>FinanceBuddy</h1>
            <p>Track your income and expenses</p>
        </header>

        <div class="summary-grid">
            <div class="summary-card income">
                <h3>Total Income</h3>
<span id="totalIncome">₹0.00</span>
            </div>
            <div class="summary-card expense">
                <h3>Total Expenses</h3>
<span id="totalExpense">₹0.00</span>
            </div>
            <div class="summary-card balance">
                <h3>Net Balance</h3>
<span id="netBalance">₹0.00</span>
            </div>
        </div>

        <div class="controls">
            <div class="filter-group">
                <label>Category: 
                    <select id="filterCategory">
                        <option value="">All</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </label>
                <label>Sub-Category: 
                    <select id="filterSubCategory">
                        <option value="">All</option>
                    </select>
                </label>
                <label>Date Range: 
                    <input type="date" id="filterStartDate">
                    to 
                    <input type="date" id="filterEndDate">
                </label>
            </div>
            <div class="sort-group">
                <label>Sort by: 
                    <select id="sortBy">
                        <option value="date-desc">Date (Newest)</option>
                        <option value="date-asc">Date (Oldest)</option>
                        <option value="amount-desc">Amount (High)</option>
                        <option value="amount-asc">Amount (Low)</option>
                    </select>
                </label>
                <button id="clearAll" class="btn btn-danger">Clear All</button>
            </div>
        </div>

        <div class="charts-wrapper">
            <div class="chart-container">
                <h3>Income by Category</h3>
                <canvas id="incomeChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Expenses by Category</h3>
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <div class="table-container">
    <div class="table-header">
        <h2>Transaction History</h2>
        <button id="exportCsv" class="btn btn-secondary">📥 Export CSV</button>
    </div>
    <div id="transactionsTable"></div>
    <p id="noTransactions" class="no-data">No transactions yet. Add one to get started!</p>
</div>
    </div>

    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="amount">Amount *:</label>
                    <input type="number" id="amount" min="0.01" step="0.01" required>
                    <span class="error" id="amountError"></span>
                </div>
                <div class="form-group">
                    <label for="date">Date *:</label>
                    <input type="date" id="date" required>
                    <span class="error" id="dateError"></span>
                </div>
                <div class="form-group">
                    <label>Category *:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="category" value="Income" required> Income</label>
                        <label><input type="radio" name="category" value="Expense" required> Expense</label>
                    </div>
                    <span class="error" id="categoryError"></span>
                </div>
                <div class="form-group">
                    <label for="subCategory">Sub-Category *:</label>
                    <select id="subCategory" required>
                        <option value="">Select...</option>
                    </select>
                    <span class="error" id="subCategoryError"></span>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" maxlength="100" rows="3"></textarea>
                    <span class="error" id="descError"></span>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Transaction</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
